# CrystalLog Nginx Configuration
# Copy to: /etc/nginx/sites-available/crystallog
# Then: sudo ln -s /etc/nginx/sites-available/crystallog /etc/nginx/sites-enabled/
# Then: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name your-domain.com;  # 修改为你的域名

    # Upload size limit for images
    client_max_body_size 20M;

    # Root to built frontend
    root /path/to/CrystalLog/client/dist;
    index index.html;

    # API reverse proxy to Node.js backend
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded images (external data dir, survives redeploy)
    location /uploads/ {
        alias /data/crystallog/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: all non-API, non-file requests go to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;
}
